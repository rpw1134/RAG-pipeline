[project]
name = "pipeline_api"
version = "0.1.0"
description = ""
authors = [
    {name = "rpw1134",email = "ryanw1134@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "fastapi (>=0.121.2,<0.122.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "unstructured[pdf] (>=0.18.18,<0.19.0)",
    "pymupdf (>=1.26.6,<2.0.0)",
    "langchain (>=1.0.7,<2.0.0)",
    "langchain-text-splitters (>=1.0.0,<2.0.0)",
    "langchain-core (>=1.0.5,<2.0.0)",
    "chromadb (>=1.3.5,<2.0.0)",
    "openai (>=2.8.1,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "sentence-transformers (>=5.1.2,<6.0.0)",
    "transformers (>=4.57.1,<5.0.0)",
    "flagembedding (>=1.3.5,<2.0.0)",
]

[tool.poetry]
packages = [{include = "pipeline_api", from = "src"}]

[tool.poetry.scripts]
dev = "pipeline_api.scripts.dev:dev"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"
pytest-mock = ">=3.12.0,<4.0.0"
pytest-cov = ">=4.1.0,<5.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
